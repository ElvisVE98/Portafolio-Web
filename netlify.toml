# netlify.toml
# ============================================================================
# Configuración automática de compilación y despliegue para Netlify (Vite + React)
# ============================================================================

[build]
  # Comando para compilar TypeScript y empaquetar con Vite
  command = "npm run build"
  
  # Carpeta donde Vite genera los archivos de producción
  publish = "dist"

# Redirección SPA para que cualquier ruta cargue index.html sin dar error 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
